format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  # For local debugging convenience. Fill in CODEPUSH_APP_ID, CODEPUSH_DEPLOYMENT, and
  # BITRISE_API_TOKEN in a .bitrise.secrets.yml next to this file, then run:
  #   bitrise run sample
  sample:
    envs:
    - TEST_REPO_URL: https://github.com/bitrise-io/release-management-code-push-demo
    - TEST_REPO_BRANCH: main
    steps:
    - script:
        title: Remove leftover _tmp folder
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            rm -rf ./_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_REPO_URL
        - branch: $TEST_REPO_BRANCH
        - clone_into_dir: ./_tmp
    - path::./:
        title: Test current Step
        inputs:
        - project_dir: ./_tmp/react_native
        - platform: android
        - app_id: $CODEPUSH_APP_ID
        - deployment: $CODEPUSH_DEPLOYMENT
        - app_version: 1.0.0
        - api_token: $BITRISE_API_TOKEN

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }
